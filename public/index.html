<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kaab</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" integrity="sha512-2/YdOMV+YNpanLCF5MdQwaoFRVbTmrJ4u4EpqS/USXAQNUDgI5uwYi6J98WVtJKcfe1AbgerygzDFToxAlOGEQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<div id="loginScreen"></div>

<div id="mainScreen" class="hidden">
  <header class="topbar">
    <div class="brand" title="Kaab"><img class="brand-logo" src="/favicon.svg" alt="Kaab" width="28" height="28"></div>
    <div class="sync-wrap" id="syncWrap" title="Estado de sincronización"><span class="sync-dot" id="syncDot"></span></div>
    <div class="top-search" id="topSearch">
      <span class="top-search-icon" id="topSearchIcon"></span>
      <input id="buscador" type="text" placeholder="Buscar cuenta…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar">
      <button class="top-search-clear hidden" id="buscadorLimpiar" type="button" aria-label="Borrar búsqueda">×</button>
    </div>
    <button class="icon-btn" id="avatarBtn" title="Perfil" style="width:auto;padding:0 4px 0 0;display:flex;align-items:center;gap:0;">
      <span class="avatar" id="avatarInitial">A</span>
      <span class="username-label" id="userLabel"></span>
    </button>
  </header>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="cobrar">Por cobrar</button>
    <button class="tab-btn" data-tab="pagar">Por pagar</button>
    <button class="tab-btn" data-tab="tienda">Movimientos tienda</button>
  </div>

  <div class="view" id="deudasView"></div>
  <div class="view hidden" id="tiendaView"></div>
</div>

<div id="modalRoot"></div>
<div id="pageRoot"></div>
<div id="toast"></div>

<div id="offlineBanner" class="hidden">
  <div class="offline-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
  </div>
  <h2>Sin conexión</h2>
  <p id="offlineMsg">No se pudo conectar con el servidor. Revisa tu internet y vuelve a intentar.</p>
  <p class="offline-auto" id="offlineAuto">Reintentando automáticamente…</p>
  <button class="reload-btn" id="reloadBtn">Reintentar ahora</button>
</div>

<script src="/ojo.js"></script>
<script src="/recorte.js"></script>
<script src="/camara.js"></script>
<script src="/app.js"></script>
<script src="/muneco.js"></script>
</body>
</html>
